[pytest]
testpaths = tests
pythonpath = . src
python_files = test_*.py
addopts = -ra --strict-markers
markers =
    m0: Milestone 0 schema and fixture smoke tests
    m1: Date rule engine tests (M1+)
    m2: Extractor and LLM runtime tests (M2+)
    m3: Confidence and ambiguity tests (M3+)
    m4: Duplicate detection tests (M4+)
    precision: Precision guardrail tests — release-blocking on zero_action fixtures
    network: Tests that need real network/Gmail access — deselected by default
    slow: Scale/performance tests (Member 1) — skip with -m 'not slow'
