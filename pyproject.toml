[project]
name = "nexa"
version = "0.1.0"
description = "Nexa Member 6 — Windows desktop UI/UX shell"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.7,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
